<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>BlockForge</title>
    <meta name="description" content="BlockForge: a blocky first-person shooter. Drop into Battle Royale, build cover, and rank up from Flint to Forgemaster." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23171a1f'/%3E%3Cpath d='M3 3h6v3h3v7H3z' fill='%23f2a93b'/%3E%3Cpath d='M6 6h3v4H6z' fill='%23171a1f'/%3E%3C/svg%3E" />
    <script>
      // if the game script never runs (blocked or failed download), say so instead of a blank page
      (function () {
        var errs = [];
        window.addEventListener('error', function (e) {
          var t = e.target;
          errs.push(e.message || (t && (t.src || t.href)) || 'load error');
        }, true);
        setTimeout(function () {
          var ui = document.getElementById('ui');
          if (window.__bfStarted || !ui) return;
          var box = document.createElement('div');
          box.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0b0e12;color:#e9edf2;font:15px system-ui,sans-serif;text-align:center;padding:24px';
          box.textContent = 'BlockForge could not start. Please reload the page.';
          var small = document.createElement('div');
          small.style.cssText = 'color:#8b95a3;font-size:12px;max-width:640px;word-break:break-all';
          small.textContent = errs.slice(0, 4).join(' | ');
          box.appendChild(small);
          ui.appendChild(box);
        }, 20000);
      })();
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
